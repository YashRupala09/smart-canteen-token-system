<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Smart Canteen</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span style="font-size: 1.5rem;">📊</span> Canteen Admin
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="token-counter.html" class="nav-item">POS / Tokens</a>
                <a href="kitchen.html" class="nav-item">Kitchen</a>
                <a href="display-board.html" class="nav-item">Display Board</a>
                <a href="menu-management.html" class="nav-item">Menu Management</a>
                <a href="reports.html" class="nav-item active">Reports</a>
                <br>
                <hr style="border:0; border-top:1px solid var(--border);"><br>
                <a href="#" class="nav-item" id="themeToggle">🌙 Dark Mode</a>
                <a href="index.html" class="nav-item text-danger">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="btn-icon menu-toggle" id="mobileMenuBtn" style="display: none;">☰</button>
                    <h1 class="page-title">Order Archives & Reports</h1>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-outline" onclick="exportData()">Export Full Backup (JSON)</button>
                    <label class="btn btn-outline" style="margin:0; cursor:pointer;">
                        Restore Backup
                        <input type="file" id="importFile" accept=".json" style="display:none;"
                            onchange="importData(event)">
                    </label>
                </div>
            </header>

            <div class="content-area">

                <div class="card filter-bar"
                    style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center;">
                    <input type="date" id="dateFilter" class="form-control" style="max-width: 200px;">
                    <select id="statusFilter" class="form-control" style="max-width: 200px;">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="preparing">Preparing</option>
                        <option value="ready">Ready</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <input type="text" id="tokenSearch" class="form-control" placeholder="Search Token #"
                        style="max-width: 150px;">
                </div>

                <div class="card">
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; text-align: left; border-collapse: collapse;">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--border);">
                                    <th style="padding: 12px;">Token</th>
                                    <th style="padding: 12px;">Time</th>
                                    <th style="padding: 12px;">Items Summary</th>
                                    <th style="padding: 12px;">Total</th>
                                    <th style="padding: 12px;">Status</th>
                                    <th style="padding: 12px; text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="reportsTableBody">
                                <!-- Rendered via JS -->
                            </tbody>
                        </table>
                        <div id="emptyState"
                            style="text-align: center; padding: 40px; display: none; color: var(--text-muted)">
                            <p>No orders matched your filters.</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>

</html>
